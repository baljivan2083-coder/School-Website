<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade-Sheet Search System - Shree Bal Jivan Jyoti Secondary School</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 3D and Smooth Dynamic Effects */
        .card-3d {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.15), 0 10px 15px -5px rgba(0, 0, 0, 0.05);
        }
        .card-3d:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px -12px rgba(30, 58, 138, 0.25);
        }
        .btn-3d {
            transition: all 0.2s ease;
            box-shadow: 0 6px 12px -2px rgba(29, 78, 216, 0.35), 0 3px 6px -2px rgba(29, 78, 216, 0.2);
        }
        .btn-3d:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -3px rgba(29, 78, 216, 0.45), 0 4px 8px -2px rgba(29, 78, 216, 0.2);
        }
        .btn-3d:active {
            transform: translateY(1px);
        }
        /* Single line text auto-scaling for mobile screens */
        .school-title {
            white-space: nowrap;
            font-size: clamp(0.85rem, 2.2vw, 1.25rem);
            letter-spacing: -0.025em;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-100 via-indigo-50 to-slate-200 min-h-screen flex flex-col items-center justify-center p-4 sm:p-6">

    <div class="max-w-lg w-full bg-white/90 backdrop-blur-md p-6 sm:p-8 rounded-3xl card-3d border border-white/80">
        <!-- School Banner/Header -->
        <div class="text-center mb-6 pb-5 border-b border-gray-100">
            <div class="inline-block p-3 bg-blue-600 text-white rounded-2xl shadow-lg mb-3 transform hover:rotate-6 transition duration-300">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
                </svg>
            </div>
            <!-- School Name in a single line with smart scaling -->
            <h1 class="font-black text-blue-900 uppercase school-title drop-shadow-sm">
                Shree Bal Jivan Jyoti Secondary School
            </h1>
            <p class="text-xs sm:text-sm text-gray-500 font-semibold mt-1 tracking-wide">Manahari-01, Makari, Makawanpur</p>
            <div class="w-20 h-1.5 bg-gradient-to-r from-blue-500 to-indigo-600 mx-auto mt-3 rounded-full"></div>
        </div>

        <h2 class="text-sm sm:text-base font-bold mb-6 text-blue-900 text-center bg-gradient-to-r from-blue-50 to-indigo-50 py-3 px-4 rounded-2xl border border-blue-100 shadow-inner">
            विद्यालयको नतिजा व्यवस्थापन पोर्टलमा हार्दिक स्वागत छ!
        </h2>
        
        <div class="space-y-5">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">
                    कहाँको नतिजा हेर्ने हो, कृपया ड्रपडाउनबाट छान्नुहोस्:
                </label>
                <div class="relative">
                    <select id="exam-selector" class="w-full p-4 border-2 border-gray-200 rounded-2xl bg-gray-50/80 focus:bg-white focus:ring-4 focus:ring-blue-500/20 focus:border-blue-600 outline-none font-semibold text-gray-800 transition appearance-none cursor-pointer">
                        <option value="">-- परीक्षाको किसिम छान्नुहोस् --</option>
                        <option value="first-terminal">पहिलो त्रैमासिक परीक्षा (First Terminal 2083)</option>
                        <option value="second-terminal">दोस्रो त्रैमासिक परीक्षा (Second Terminal 2083)</option>
                        <option value="final-exam">वार्षिक परीक्षा (Final Exam 2083)</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                        </svg>
                    </div>
                </div>
            </div>
            
            <button onclick="proceedToResult()" class="w-full bg-gradient-to-r from-blue-700 to-indigo-700 hover:from-blue-800 hover:to-indigo-800 text-white py-4 rounded-2xl font-bold btn-3d tracking-wide flex items-center justify-center space-x-2 text-base">
                <span>नतिजा हेर्नुहोस्</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
            </button>
        </div>

        <!-- Error Message Display -->
        <div id="error-display" class="mt-5 p-3.5 bg-red-50 text-red-600 border border-red-200 rounded-2xl hidden text-center text-sm font-semibold shadow-sm animate-pulse"></div>
    </div>

    <!-- Footer Credit -->
    <footer class="mt-8 text-center text-xs text-gray-500 font-semibold tracking-wide">
        &copy; 2083 Shree Bal Jivan Jyoti Secondary School. All rights reserved.
    </footer>

    <script>
        function proceedToResult() {
            const examSelector = document.getElementById('exam-selector').value;
            const errDisplay = document.getElementById('error-display');

            // Reset error message
            errDisplay.classList.add('hidden');
            errDisplay.innerText = "";

            if (!examSelector) {
                errDisplay.innerText = "कृपया ड्रपडाउनबाट परीक्षाको किसिम छान्नुहोस्।";
                errDisplay.classList.remove('hidden');
                return;
            }

            // Define URLs
            const urls = {
                "first-terminal": "https://script.google.com/macros/s/AKfycbx29k3UgCHtqCloaGxoxKHg2TOD-YBx6Sv5K2acIy4efbSE2uvAwRaVEzvK0wgMm-wYDQ/exec",
                "second-terminal": "https://script.google.com/macros/s/AKfycbxZ_C8ChoLiV7v4BQ1jE-4HPuCkkgE1CVFCldFvfWmFKtvsX6ei27Oc-7vSxrlQGATn/exec",
                "final-exam": "https://script.google.com/macros/s/AKfycbxTxml5xMyjQ3OISmeE81ni4cum_V-0YEFJ2S4-SBrqodEojVK-FOjVoghDSPkop1p5/exec"
            };

            // Redirect to the selected URL
            window.location.href = urls[examSelector];
        }
    </script>
</body>
</html>
