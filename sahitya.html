    const container = document.getElementById('content-container');
    
    function createCard(item) {
        return `
            <div class="card">
                <div class="content-area">
                    <h3>${item.title}</h3>
                    <p>${item.text}</p>
                    <div class="social-actions">
                        <a href="#" title="Like"><i class="far fa-thumbs-up"></i></a>
                        <a href="#" title="Comment"><i class="far fa-comment"></i></a>
                        <a href="https://www.facebook.com/sharer/sharer.php?u=https://your-website-url.com" target="_blank" title="Share"><i class="fas fa-share"></i></a>
                    </div>
                </div>
                <div class="author-section">
                    <img src="${item.photo}" class="author-photo" onclick="openModal(this.src)" onerror="this.src='default.jpg'">
                    <div class="author-info">
                        <span class="author-name">नाम: ${item.name}</span>
                        <span>विद्यालय: ${item.school}</span><br>
                        <span>ठेगाना: ${item.address}</span><br>
                        <span>कक्षा: ${item.class}</span>
                    </div>
                </div>
            </div>
        `;
    }

    container.innerHTML += '<div class="section-wrapper"><h2>कविता सङ्ग्रह</h2></div><div class="grid-container" id="poem-grid"></div>';
    poems.forEach(p => document.getElementById('poem-grid').innerHTML += createCard(p));

    container.innerHTML += '<div class="section-wrapper"><h2>बाल कथाहरू</h2></div><div class="grid-container" id="story-grid"></div>';
    stories.forEach(s => document.getElementById('story-grid').innerHTML += createCard(s));

    function openModal(src) { document.getElementById("fullImage").src = src; document.getElementById("imageModal").style.display = "flex"; }
    function closeModal() { document.getElementById("imageModal").style.display = "none"; }
</script>

</body>
</html>
